<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕的海岸骑行</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            display: grid;
            place-items: center;
            background: #dff4f7;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        .frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .cloud-slow {
            animation: cloud-drift 32s linear infinite;
        }

        .cloud-fast {
            animation: cloud-drift 20s linear infinite;
        }

        .hill-far {
            animation: hill-drift 28s ease-in-out infinite alternate;
        }

        .hill-near {
            animation: hill-drift 18s ease-in-out infinite alternate-reverse;
        }

        .rider {
            transform-origin: 615px 510px;
            animation: rider-bob 0.78s ease-in-out infinite alternate;
        }

        .tail {
            transform-origin: 541px 319px;
            animation: tail-flick 2.2s ease-in-out infinite alternate;
        }

        .wing {
            transform-origin: 655px 310px;
            animation: wing-steer 1.56s ease-in-out infinite alternate;
        }

        .scarf-tail-a {
            transform-origin: 650px 209px;
            animation: scarf-a 1.05s ease-in-out infinite alternate;
        }

        .scarf-tail-b {
            transform-origin: 650px 208px;
            animation: scarf-b 1.28s ease-in-out infinite alternate-reverse;
        }

        .wheel {
            transform-box: fill-box;
            transform-origin: center;
            animation: spin 0.78s linear infinite;
        }

        .crank {
            transform-origin: 570px 430px;
            animation: spin 0.78s linear infinite;
        }

        .leg-left {
            transform-origin: 626px 319px;
            animation: leg-left 0.78s ease-in-out infinite;
        }

        .leg-right {
            transform-origin: 626px 319px;
            animation: leg-right 0.78s ease-in-out infinite;
        }

        .eye-blink {
            transform-origin: 809px 148px;
            animation: blink 4.2s linear infinite;
        }

        .speed-line-a {
            animation: speed 1.4s linear infinite;
        }

        .speed-line-b {
            animation: speed 1.8s linear infinite 0.25s;
        }

        .speed-line-c {
            animation: speed 2.1s linear infinite 0.5s;
        }

        .bird {
            animation: bird-fly 12s linear infinite;
        }

        .wheel-shadow {
            transform-origin: center;
            animation: shadow-pulse 0.78s ease-in-out infinite alternate;
        }

        @keyframes cloud-drift {
            from {
                transform: translateX(-180px);
            }
            to {
                transform: translateX(1380px);
            }
        }

        @keyframes hill-drift {
            from {
                transform: translateX(-18px);
            }
            to {
                transform: translateX(18px);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rider-bob {
            from {
                transform: translateY(0) rotate(-0.2deg);
            }
            to {
                transform: translateY(-3px) rotate(0.25deg);
            }
        }

        @keyframes tail-flick {
            from {
                transform: rotate(-2deg);
            }
            to {
                transform: rotate(4deg);
            }
        }

        @keyframes wing-steer {
            from {
                transform: rotate(-2deg);
            }
            to {
                transform: rotate(3deg);
            }
        }

        @keyframes scarf-a {
            from {
                transform: rotate(7deg) skewX(3deg);
            }
            to {
                transform: rotate(-8deg) skewX(-5deg);
            }
        }

        @keyframes scarf-b {
            from {
                transform: rotate(-4deg) skewX(-3deg);
            }
            to {
                transform: rotate(9deg) skewX(6deg);
            }
        }

        @keyframes leg-left {
            0%,
            100% {
                transform: rotate(18deg);
            }
            50% {
                transform: rotate(-22deg);
            }
        }

        @keyframes leg-right {
            0%,
            100% {
                transform: rotate(-22deg);
            }
            50% {
                transform: rotate(18deg);
            }
        }

        @keyframes blink {
            0%,
            43%,
            47%,
            100% {
                transform: scaleY(1);
            }
            45% {
                transform: scaleY(0.08);
            }
        }

        @keyframes speed {
            0% {
                opacity: 0;
                transform: translateX(70px);
            }
            25% {
                opacity: 0.55;
            }
            100% {
                opacity: 0;
                transform: translateX(-260px);
            }
        }

        @keyframes bird-fly {
            from {
                transform: translate(-160px, 0);
            }
            to {
                transform: translate(1350px, -18px);
            }
        }

        @keyframes shadow-pulse {
            from {
                transform: scaleX(1);
                opacity: 0.2;
            }
            to {
                transform: scaleX(0.88);
                opacity: 0.13;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
