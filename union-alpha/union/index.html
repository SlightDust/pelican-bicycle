<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑行·孙悟空大飞机·北极熊打螺丝</title>
<style>
html,body{margin:0;padding:0;background:#dceef2;}
.stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
svg{width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div class="stage">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-label="鹈鹕骑自行车在孙悟空开的飞机机翼上，翅膀托着北极熊，秦始皇骑在熊背打螺丝">
<defs>
<linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#7fc4e8"/><stop offset="1" stop-color="#eaf7fb"/>
</linearGradient>
<linearGradient id="g-sea" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#3f7fae"/><stop offset="1" stop-color="#2b5e86"/>
</linearGradient>
<linearGradient id="g-fus" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#aebccb"/>
</linearGradient>
<linearGradient id="g-wing" x1="0" y1="0" x2="1" y2="0.3">
<stop offset="0" stop-color="#eef3f7"/><stop offset="1" stop-color="#9db0c1"/>
</linearGradient>
<radialGradient id="g-sun" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#ffb84d"/>
</radialGradient>
<linearGradient id="g-cloud" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dceaf2"/>
</linearGradient>
<linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#c98a1e"/>
</linearGradient>
<linearGradient id="g-fur" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9e1ea"/>
</linearGradient>
<linearGradient id="g-robe" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2e2a28"/><stop offset="1" stop-color="#151312"/>
</linearGradient>
</defs>
<style>
@keyframes planeBob{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-12px)}}
@keyframes wheelSpin{to{transform:rotate(360deg)}}
@keyframes wingFlap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-5deg)}}
@keyframes cloudDrift{from{transform:translateX(0)}to{transform:translateX(-1560px)}}
@keyframes screwTwist{0%,100%{transform:rotate(0deg)}50%{transform:rotate(180deg)}}
@keyframes armPump{0%,100%{transform:rotate(0deg)}50%{transform:rotate(7deg)}}
@keyframes dashFlow{to{stroke-dashoffset:-84}}
@keyframes scarfWave{0%,100%{transform:skewY(0deg)}50%{transform:skewY(7deg)}}
@keyframes bearBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#plane-bob{animation:planeBob 4.5s ease-in-out infinite}
#wheel-front,#wheel-rear{animation:wheelSpin 1.4s linear infinite;transform-box:fill-box;transform-origin:center}
#pelican-wings{animation:wingFlap 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 15%}
.cloud-move{animation:cloudDrift 26s linear infinite}
#screw-bit{animation:screwTwist .5s linear infinite;transform-box:fill-box;transform-origin:center}
#qin-arm{animation:armPump .8s ease-in-out infinite;transform-box:fill-box;transform-origin:80% 10%}
#speed-lines{stroke-dasharray:24 18;animation:dashFlow .7s linear infinite}
#scarf{animation:scarfWave 1.7s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
#bear-head{animation:bearBob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
</style>
