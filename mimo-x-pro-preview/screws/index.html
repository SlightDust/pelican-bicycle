<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鹈鹕骑车 · 猴王专机 · 嬴政打螺丝</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0b1c33;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  svg.scene {
    width: 100%; height: 100%;
    max-width: 1400px;
    max-height: 100vh;
    display: block;
  }
  /* ===== 天空云层 ===== */
  .cloud-layer { animation: cloud-drift 48s linear infinite; }
  .cloud-layer.slow { animation-duration: 80s; }
  .cloud-layer.fast { animation-duration: 32s; }
  @keyframes cloud-drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-1600px); }
  }
  .star { animation: twinkle 2.4s ease-in-out infinite; }
  .star:nth-child(odd) { animation-delay: 0.6s; }
  .star:nth-child(3n)  { animation-delay: 1.2s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 0.95; }
  }
  /* ===== 机身颠簸 ===== */
  .plane-bob {
    animation: plane-bob 2.8s ease-in-out infinite;
    transform-origin: 620px 380px;
  }
  @keyframes plane-bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    30%      { transform: translateY(-6px) rotate(-0.6deg); }
    65%      { transform: translateY(4px)  rotate(0.5deg); }
  }
  /* ===== 螺旋桨 ===== */
  .propeller {
    animation: spin 0.18s linear infinite;
    transform-origin: 1180px 360px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .prop-blur {
    animation: blur-pulse 0.36s linear infinite;
    transform-origin: 1180px 360px;
  }
  @keyframes blur-pulse { to { transform: rotate(360deg); } }
  /* ===== 猴王金箍棒旋转 ===== */
  .staff-spin {
    animation: staff-spin 3.2s ease-in-out infinite;
    transform-origin: 0 0;
  }
  @keyframes staff-spin {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(12deg); }
  }
  /* ===== 猴王眨眼 / 头晃 ===== */
  .monkey-blink {
    animation: blink 4.5s step-end infinite;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    94%, 96%      { transform: scaleY(0.08); }
  }
  .monkey-head {
    animation: head-tilt 2.2s ease-in-out infinite;
    transform-origin: 1040px 318px;
  }
  @keyframes head-tilt {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(3deg); }
  }
  /* ===== 鹈鹕身体起伏 ===== */
  .pelican-body {
    animation: pelican-ride 1.1s ease-in-out infinite;
    transform-origin: 480px 470px;
  }
  @keyframes pelican-ride {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }
  /* ===== 鹈鹕翅膀扇动 ===== */
  .wing-l {
    animation: flap-l 1.1s ease-in-out infinite;
    transform-origin: 455px 445px;
  }
  .wing-r {
    animation: flap-r 1.1s ease-in-out infinite;
    transform-origin: 510px 445px;
  }
  @keyframes flap-l {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-18deg); }
  }
  @keyframes flap-r {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(16deg); }
  }
  /* ===== 喙袋晃动 ===== */
  .pouch {
    animation: pouch-sway 1.1s ease-in-out infinite;
    transform-origin: 520px 490px;
  }
  @keyframes pouch-sway {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(6deg); }
  }
  /* ===== 自行车轮 ===== */
  .wheel {
    animation: spin 0.55s linear infinite;
  }
  .wheel.rear { transform-origin: 420px 545px; }
  .wheel.front { transform-origin: 560px 545px; }
  /* ===== 脚踏 / 腿 ===== */
  .pedal-crank {
    animation: spin 0.55s linear infinite;
    transform-origin: 490px 530px;
  }
  .leg-l {
    animation: pedal-l 0.55s linear infinite;
    transform-origin: 490px 530px;
  }
  .leg-r {
    animation: pedal-r 0.55s linear infinite;
    transform-origin: 490px 530px;
  }
  @keyframes pedal-l {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes pedal-r {
    from { transform: rotate(180deg); }
    to   { transform: rotate(540deg); }
  }
  /* ===== 北极熊行走/站立晃动 ===== */
  .bear-body {
    animation: bear-sway 1.4s ease-in-out infinite;
    transform-origin: 490px 420px;
  }
  @keyframes bear-sway {
    0%, 100% { transform: rotate(-1.5deg) translateY(0); }
    50%      { transform: rotate(1.5deg)  translateY(-3px); }
  }
  .bear-head {
    animation: bear-nod 1.4s ease-in-out infinite;
    transform-origin: 530px 375px;
  }
  @keyframes bear-nod {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(4deg); }
  }
  .bear-paw {
    animation: paw-tap 0.7s ease-in-out infinite;
    transform-origin: 460px 445px;
  }
  .bear-paw.b { animation-delay: 0.35s; transform-origin: 520px 445px; }
  @keyframes paw-tap {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  /* ===== 嬴政挥锤 / 螺丝刀 ===== */
  .emperor-body {
    animation: empress 0.9s ease-in-out infinite;
    transform-origin: 490px 360px;
  }
  @keyframes empress {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(2deg); }
  }
  .screwdriver-arm {
    animation: screw-turn 0.55s ease-in-out infinite;
    transform-origin: 545px 365px;
  }
  @keyframes screw-turn {
    0%, 100% { transform: rotate(-18deg); }
    50%      { transform: rotate(22deg); }
  }
  .screwdriver-tip {
    animation: tip-spin 0.55s linear infinite;
    transform-origin: 580px 390px;
  }
  @keyframes tip-spin { to { transform: rotate(360deg); } }
  /* ===== 螺丝飞入 / 火花 ===== */
  .spark {
    animation: spark-fly 0.55s ease-out infinite;
    opacity: 0;
  }
  .spark:nth-child(1) { animation-delay: 0.00s; }
  .spark:nth-child(2) { animation-delay: 0.12s; }
  .spark:nth-child(3) { animation-delay: 0.24s; }
  .spark:nth-child(4) { animation-delay: 0.36s; }
  @keyframes spark-fly {
    0%   { opacity: 0; transform: translate(0,0) scale(0.4); }
    30%  { opacity: 1; transform: translate(6px,-8px) scale(1); }
    100% { opacity: 0; transform: translate(18px,-18px) scale(0.2); }
  }
  .screw-orbit {
    animation: screw-orbit 2.2s linear infinite;
  }
  @keyframes screw-orbit {
    from { transform: rotate(0deg) translateX(28px) rotate(0deg); }
    to   { transform: rotate(360deg) translateX(28px) rotate(-360deg); }
  }
  /* ===== 机翼铆钉闪 ===== */
  .rivet {
    animation: rivet-flash 2s ease-in-out infinite;
  }
  .rivet:nth-child(2n) { animation-delay: 0.4s; }
  .rivet:nth-child(3n) { animation-delay: 0.9s; }
  @keyframes rivet-flash {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 1; }
  }
  /* ===== 速度线 ===== */
  .speed-line {
    animation: speed 1.2s linear infinite;
  }
  .speed-line:nth-child(2) { animation-delay: 0.3s; }
  .speed-line:nth-child(3) { animation-delay: 0.6s; }
  @keyframes speed {
    0%   { transform: translateX(0); opacity: 0; }
    20%  { opacity: 0.7; }
    100% { transform: translateX(-220px); opacity: 0; }
  }
  /* ===== 龙旗飘扬 ===== */
  .flag-wave {
    animation: flag 0.8s ease-in-out infinite;
    transform-origin: left center;
  }
  @keyframes flag {
    0%, 100% { transform: scaleX(1) skewY(0deg); }
    50%      { transform: scaleX(0.92) skewY(3deg); }
  }
  /* ===== HUD 文案 ===== */
  .hud {
    position: absolute; left: 24px; bottom: 18px;
    color: rgba(255,255,255,0.75);
    font-size: 13px; letter-spacing: 0.04em;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .hud strong { color: #ffd66b; font-weight: 600; }
  body { position: relative; }
</style>
</head>
<body>
<div class="stage">
<svg class="scene" viewBox="0 0 1400 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车在孙悟空飞机机翼上，托着秦始皇的北极熊，秦始皇在熊背上打螺丝">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a1630"/>
      <stop offset="35%"  stop-color="#1a3a66"/>
      <stop offset="70%"  stop-color="#3d7ab5"/>
      <stop offset="100%" stop-color="#8ec5e8"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#ff9a4a"/>
    </linearGradient>
    <linearGradient id="fuselage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f2f5f8"/>
      <stop offset="40%"  stop-color="#d8e0e8"/>
      <stop offset="100%" stop-color="#8a96a4"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#e8eef4"/>
      <stop offset="100%" stop-color="#9aa8b6"/>
    </linearGradient>
    <linearGradient id="redStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#e74c3c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe566"/>
      <stop offset="50%"  stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#c47f0a"/>
    </linearGradient>
    <linearGradient id="furGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4dde6"/>
    </linearGradient>
    <linearGradient id="robeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2b1a0e"/>
      <stop offset="100%" stop-color="#0d0a08"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="softBig" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ============ 天空 ============ -->
  <rect width="1400" height="750" fill="url(#skyGrad)"/>

  <!-- 星星 -->
  <g fill="#fff8d6">
    <circle class="star" cx="80"  cy="50"  r="1.6"/>
    <circle class="star" cx="180" cy="90"  r="1.2"/>
    <circle class="star" cx="300" cy="40"  r="1.8"/>
    <circle class="star" cx="420" cy="110" r="1.1"/>
    <circle class="star" cx="560" cy="55"  r="1.5"/>
    <circle class="star" cx="700" cy="95"  r="1.3"/>
    <circle class="star" cx="840" cy="35"  r="1.7"/>
    <circle class="star" cx="980" cy="75"  r="1.2"/>
    <circle class="star" cx="1120" cy="50" r="1.6"/>
    <circle class="star" cx="1280" cy="100" r="1.4"/>
    <circle class="star" cx="1340" cy="40" r="1.1"/>
    <circle class="star" cx="60"  cy="140" r="1.3"/>
    <circle class="star" cx="250" cy="160" r="1.0"/>
    <circle class="star" cx="500" cy="150" r="1.5"/>
  </g>

  <!-- 月亮 -->
  <circle cx="1240" cy="120" r="58" fill="url(#glow)"/>
  <circle cx="1240" cy="120" r="42" fill="#f5f0d0"/>
  <circle cx="1258" cy="108" r="36" fill="url(#skyGrad)" opacity="0.55"/>
  <circle cx="1222" cy="130" r="5" fill="#d9d2a8" opacity="0.7"/>
  <circle cx="1248" cy="142" r="3.5" fill="#d9d2a8" opacity="0.6"/>

  <!-- 远山云海 -->
  <g class="cloud-layer slow" opacity="0.35" fill="#e8f2ff">
    <ellipse cx="100" cy="620" rx="120" ry="28"/>
    <ellipse cx="280" cy="640" rx="160" ry="32"/>
    <ellipse cx="500" cy="625" rx="140" ry="26"/>

    <ellipse cx="1000" cy="628" rx="130" ry="24"/>
    <ellipse cx="1220" cy="640" rx="150" ry="28"/>
    <ellipse cx="1400" cy="620" rx="100" ry="22"/>
    <!-- 重复一份便于循环 -->
    <ellipse cx="1700" cy="620" rx="120" ry="28"/>
    <ellipse cx="1880" cy="640" rx="160" ry="32"/>
  </g>

  <g class="cloud-layer" opacity="0.55" fill="#ffffff">
    <ellipse cx="150" cy="180" rx="70" ry="18"/>
    <ellipse cx="200" cy="175" rx="45" ry="14"/>
    <ellipse cx="110" cy="185" rx="40" ry="12"/>
    <ellipse cx="700" cy="200" rx="90" ry="20"/>
    <ellipse cx="760" cy="192" rx="50" ry="14"/>
    <ellipse cx="1050" cy="160" rx="80" ry="18"/>
    <ellipse cx="1100" cy="155" rx="45" ry="12"/>
    <ellipse cx="1400" cy="190" rx="70" ry="16"/>
    <ellipse cx="1480" cy="185" rx="50" ry="14"/>
    <ellipse cx="1750" cy="180" rx="70" ry="18"/>
  </g>

  <g class="cloud-layer fast" opacity="0.4" fill="#ffffff">
    <ellipse cx="400" cy="280" rx="55" ry="12"/>
    <ellipse cx="440" cy="275" rx="35" ry="10"/>
    <ellipse cx="900" cy="300" rx="60" ry="14"/>
    <ellipse cx="940" cy="294" rx="38" ry="10"/>
    <ellipse cx="1300" cy="270" rx="50" ry="12"/>
    <ellipse cx="1600" cy="280" rx="55" ry="12"/>
  </g>

  <!-- 速度线 -->
  <g opacity="0.5" stroke="#cfe8ff" stroke-width="2" stroke-linecap="round">
    <line class="speed-line" x1="100" y1="340" x2="200" y2="340"/>
    <line class="speed-line" x1="60"  y1="420" x2="180" y2="420"/>
    <line class="speed-line" x1="120" y1="500" x2="230" y2="500"/>
  </g>

  <!-- ============ 飞机（孙悟空驾驶） ============ -->
  <g class="plane-bob">
    <!-- 阴影 -->
    <ellipse cx="700" cy="520" rx="380" ry="14" fill="#000" opacity="0.12" filter="url(#softBig)"/>

    <!-- 尾翼 -->
    <g>
      <path d="M 280 340 L 220 260 L 250 260 L 310 330 Z" fill="#d0d8e0" stroke="#6a7684" stroke-width="1.5"/>
      <path d="M 250 280 L 235 268 L 248 268 L 260 278 Z" fill="url(#redStripe)"/>
      <path d="M 300 355 L 240 355 L 230 375 L 300 375 Z" fill="#b8c2cc" stroke="#6a7684" stroke-width="1"/>
    </g>

    <!-- 机身 -->
    <path d="M 280 370
             C 280 340, 320 320, 420 315
             L 980 315
             C 1080 315, 1140 330, 1170 360
             C 1180 372, 1180 388, 1170 400
             C 1140 430, 1080 445, 980 445
             L 420 445
             C 320 445, 280 425, 280 395 Z"
          fill="url(#fuselage)" stroke="#5a6570" stroke-width="2"/>

    <!-- 红色腰线 -->
    <path d="M 300 375 L 1155 372" stroke="url(#redStripe)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <path d="M 300 390 L 1155 388" stroke="#c0392b" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

    <!-- 金色祥云纹（悟空彩绘） -->
    <g fill="none" stroke="#f0b429" stroke-width="2" opacity="0.7">
      <path d="M 360 400 q 12 -10 24 0 q 12 10 24 0"/>
      <path d="M 430 400 q 12 -10 24 0 q 12 10 24 0"/>
      <path d="M 500 400 q 12 -10 24 0 q 12 10 24 0"/>
    </g>
    <!-- 「齐天大圣」字样 -->
    <text x="580" y="408" font-size="18" font-family="KaiTi, STKaiti, serif" fill="#c0392b" font-weight="700" letter-spacing="6">齐天大圣号</text>

    <!-- 客舱舷窗 -->
    <g>
      <circle cx="360" cy="345" r="11" fill="#7ec8e8" stroke="#4a5560" stroke-width="1.5"/>
      <circle cx="400" cy="345" r="11" fill="#7ec8e8" stroke="#4a5560" stroke-width="1.5"/>
      <circle cx="440" cy="345" r="11" fill="#7ec8e8" stroke="#4a5560" stroke-width="1.5"/>
      <circle cx="480" cy="345" r="11" fill="#7ec8e8" stroke="#4a5560" stroke-width="1.5"/>
      <circle cx="520" cy="345" r="11" fill="#7ec8e8" stroke="#4a5560" stroke-width="1.5"/>
      <circle cx="560" cy="345" r="11" fill="#7ec8e8" stroke="#4a5560" stroke-width="1.5"/>
      <circle cx="600" cy="345" r="11" fill="#7ec8e8" stroke="#4a5560" stroke-width="1.5"/>
      <circle cx="640" cy="345" r="11" fill="#7ec8e8" stroke="#4a5560" stroke-width="1.5"/>
      <circle cx="680" cy="345" r="11" fill="#7ec8e8" stroke="#4a5560" stroke-width="1.5"/>
      <circle cx="720" cy="345" r="11" fill="#7ec8e8" stroke="#4a5560" stroke-width="1.5"/>
      <circle cx="760" cy="345" r="11" fill="#7ec8e8" stroke="#4a5560" stroke-width="1.5"/>
      <circle cx="800" cy="345" r="11" fill="#7ec8e8" stroke="#4a5560" stroke-width="1.5"/>
      <circle cx="840" cy="345" r="11" fill="#7ec8e8" stroke="#4a5560" stroke-width="1.5"/>

      <circle cx="920" cy="345" r="11" fill="#7ec8e8" stroke="#4a5560" stroke-width="1.5"/>

      <circle cx="360" cy="348" r="3"/>
      <rect x="357" y="350" width="6" height="5" rx="1"/>

      <circle cx="800" cy="348" r="3"/>
      <rect x="797" y="350" width="6" height="5" rx="1"/>

    <!-- 驾驶舱 -->
    <path d="M 1040 325
             C 1100 325, 1145 345, 1165 375
             C 1145 405, 1100 425, 1040 425 Z"
          fill="#5a8ab0" stroke="#3a4a58" stroke-width="2" opacity="0.95"/>

          fill="#9fd0ee" opacity="0.55"/>

    <path d="M 1060 340 C 1080 342, 1095 350, 1105 360"
          stroke="#e0f4ff" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>

    <!-- ========== 孙悟空（驾驶舱内） ========== -->
    <g class="monkey-head">
      <!-- 脸 -->
      <ellipse cx="1095" cy="375" rx="22" ry="20" fill="#c8a06a" stroke="#8a6030" stroke-width="1.5"/>
      <!-- 心形脸盘 -->
      <path d="M 1078 370
               Q 1078 358, 1090 358
               Q 1095 358, 1095 362
               Q 1095 358, 1100 358
               Q 1112 358, 1112 370
               Q 1112 385, 1095 392
               Q 1078 385, 1078 370 Z"
            fill="#f0d0a0"/>
      <!-- 眼睛 -->
      <g class="monkey-blink" style="transform-origin:1095px 372px">
        <ellipse cx="1087" cy="372" rx="4.5" ry="5" fill="#1a1a1a"/>
        <ellipse cx="1103" cy="372" rx="4.5" ry="5" fill="#1a1a1a"/>
        <circle cx="1088.5" cy="370.5" r="1.5" fill="#fff"/>
        <circle cx="1104.5" cy="370.5" r="1.5" fill="#fff"/>
      </g>
      <!-- 眉毛 -->
      <path d="M 1082 365 Q 1087 362, 1092 365" stroke="#5a3a18" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- 鼻/嘴 -->
      <ellipse cx="1095" cy="380" rx="3" ry="2" fill="#c07050"/>
      <path d="M 1088 385 Q 1095 390, 1102 385" stroke="#8a5030" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- 耳朵 -->
      <ellipse cx="1074" cy="372" rx="6" ry="8" fill="#c8a06a" stroke="#8a6030" stroke-width="1"/>
      <ellipse cx="1116" cy="372" rx="6" ry="8" fill="#c8a06a" stroke="#8a6030" stroke-width="1"/>
      <!-- 金箍 -->
