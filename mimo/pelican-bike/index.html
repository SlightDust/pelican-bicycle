<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕扛着自行车跑</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene">
    <canvas id="stage"></canvas>
    <header class="hud">
      <h1>鹈鹕扛着自行车跑</h1>
      <p class="sub">A 2D Running Loop</p>
    </header>
    <div class="controls">
      <button id="btn-speed" type="button">速度 ×1</button>
      <button id="btn-pause" type="button">暂停</button>
      <button id="btn-theme" type="button">黄昏</button>
    </div>
    <footer class="tips">空格暂停 · ↑↓ 调速 · →← 移动</footer>
  </div>
  <script src="main.js"></script>
</body>
</html>
