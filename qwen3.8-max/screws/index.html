<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高空打螺丝 · 悟空航空特班「大秦工程」</title>
<style>
  :root {
    --bg-1: #0b1020;
    --bg-2: #1a2340;
    --ink: #eef1f8;
    --muted: #9aa4bd;
    --gold: #e0a92e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(1200px 700px at 50% -10%, var(--bg-2), var(--bg-1) 70%);
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 48px;
  }
  .stage {
    position: relative;
    width: min(1500px, 100%);
  }
  .frame {
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.07);
    background: #7cc3ef;
  }
  svg { display: block; width: 100%; height: auto; }
  .hud {
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    gap: 8px;
  }
  .hud button {
    appearance: none;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(13, 20, 40, .55);
    color: var(--ink);
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background .15s, border-color .15s;
  }
  .hud button:hover { background: rgba(30, 44, 84, .75); border-color: var(--gold); }
  header { width: min(1500px, 100%); margin-bottom: 18px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: .04em; }
  h1 .tag { color: var(--gold); }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
  footer {
    width: min(1500px, 100%);
    margin-top: 16px;
    color: var(--muted);
    font-size: 12.5px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  footer .seal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px; height: 34px;
    border-radius: 6px;
    background: #b03028;
    color: #fff3e2;
    font-family: "Kaiti SC", "STKaiti", "Songti SC", serif;
    font-size: 12px;
    line-height: 1.15;
    text-align: center;
    letter-spacing: 0;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
    transform: rotate(-4deg);
  }

  /* ---------- SVG 动画 ---------- */
  #scene * { transform-box: view-box; }

  #plane { transform-origin: 800px 560px; animation: bob 5.2s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-.3deg); }
    50%      { transform: translateY(-10px) rotate(.3deg); }
  }

  .drift { animation-name: drift; animation-timing-function: linear; animation-iteration-count: infinite; }
  @keyframes drift { from { transform: translateX(-340px); } to { transform: translateX(1960px); } }
  .dr1 { animation-duration: 30s;  animation-delay: -4s;  }
  .dr2 { animation-duration: 44s;  animation-delay: -18s; }
  .dr3 { animation-duration: 62s;  animation-delay: -33s; }
  .dr4 { animation-duration: 38s;  animation-delay: -26s; }
  .dr5 { animation-duration: 52s;  animation-delay: -9s;  }
  .dr6 { animation-duration: 70s;  animation-delay: -47s; }

  .sea-back  { animation: seaBack 26s linear infinite; }
  .sea-front { animation: seaFront 15s linear infinite; }
  @keyframes seaBack  { from { transform: translateX(0); } to { transform: translateX(160px); } }
  @keyframes seaFront { from { transform: translateX(0); } to { transform: translateX(200px); } }

  .sun-glow { transform-box: fill-box; transform-origin: center; animation: sunPulse 6s ease-in-out infinite; }
  @keyframes sunPulse { 0%,100% { opacity:.5; transform: scale(1);} 50% { opacity:.8; transform: scale(1.07);} }

  #prop { transform-origin: 72px 575px; animation: spin .12s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #wheelF { transform-origin: 765px 598px; animation: spinCCW 1.1s linear infinite; }
  #wheelR { transform-origin: 945px 598px; animation: spinCCW 1.1s linear infinite; }
  @keyframes spinCCW { to { transform: rotate(-360deg); } }

  #crank { transform-origin: 858px 612px; animation: spinCCW 1.1s linear infinite; }
  .chain-run { stroke-dasharray: 5 4; animation: chainRun .3s linear infinite; }
  @keyframes chainRun { to { stroke-dashoffset: -18; } }

  #legNear { transform-origin: 902px 528px; animation: legSwing 1.1s ease-in-out infinite; }
  #legFar  { transform-origin: 898px 526px; animation: legSwing 1.1s ease-in-out -0.55s infinite; }
  @keyframes legSwing { 0%,100% { transform: rotate(-7deg);} 50% { transform: rotate(7deg);} }

  #wingNear { transform-origin: 890px 445px; animation: flapNear 3s ease-in-out infinite; }
  #wingFar  { transform-origin: 885px 440px; animation: flapNear 3s ease-in-out -1.5s infinite; }
  @keyframes flapNear { 0%,100% { transform: rotate(1.8deg);} 50% { transform: rotate(-1.8deg);} }

  #bear { animation: bearBob 2.6s ease-in-out infinite; }
  @keyframes bearBob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-4px);} }
  #qsg { animation: bearBob 2.6s ease-in-out .12s infinite; }

  #bearHead { transform-origin: 852px 318px; animation: headNod 3.4s ease-in-out infinite; }
  @keyframes headNod { 0%,100% { transform: rotate(1.6deg);} 50% { transform: rotate(-1.6deg);} }
  #bearTail { transform-origin: 996px 334px; animation: tailWag 1.7s ease-in-out infinite; }
  @keyframes tailWag { 0%,100% { transform: rotate(-8deg);} 50% { transform: rotate(8deg);} }

  #flag { transform-origin: 1000px 214px; animation: flagWave .9s ease-in-out infinite; }
  @keyframes flagWave {
    0%,100% { transform: rotate(-2.5deg) skewY(-1.2deg); }
    50%     { transform: rotate(2.5deg) skewY(1.6deg); }
  }

  #driveArm { transform-origin: 926px 264px; animation: driveArm .55s ease-in-out infinite; }
  @keyframes driveArm { 0%,100% { transform: rotate(-6deg);} 50% { transform: rotate(7deg);} }
  #screwTurn { transform-origin: 888px 334px; animation: spin .55s linear infinite; }
  .spark { transform-box: fill-box; transform-origin: center; animation: sparkPulse .55s ease-out infinite; }
  @keyframes sparkPulse {
    0%      { opacity: 0; transform: scale(.3); }
    40%     { opacity: 1; transform: scale(1.15); }
    70%,100%{ opacity: 0; transform: scale(.6); }
  }
  .glint { transform-box: fill-box; transform-origin: center; animation: glintTwinkle 2.4s ease-in-out infinite; }
  .glint.g2 { animation-delay: .9s; }
  @keyframes glintTwinkle { 0%,78%,100% { opacity:0; transform: scale(.4) rotate(0);} 86% { opacity:1; transform: scale(1) rotate(20deg);} 93% { opacity:.25; transform: scale(.7);} }

  #qsHead { transform-origin: 938px 206px; animation: headSway 4.2s ease-in-out infinite; }
  @keyframes headSway { 0%,100% { transform: rotate(-1.2deg);} 50% { transform: rotate(1.2deg);} }
  .bead { animation: beadSway 2.2s ease-in-out infinite; }
  .bead.b1 { transform-origin: 912px 156px; }
  .bead.b2 { transform-origin: 919px 156px; animation-delay: .12s; }
  .bead.b3 { transform-origin: 926px 156px; animation-delay: .24s; }
  .bead.b4 { transform-origin: 933px 156px; animation-delay: .36s; }
  @keyframes beadSway { 0%,100% { transform: rotate(-3deg);} 50% { transform: rotate(3.4deg);} }

  #wukongHead { animation: monBob 3.2s ease-in-out infinite; }
  @keyframes monBob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-3px);} }
  .wuk-eye { transform-box: fill-box; transform-origin: center; animation: blink 4.2s linear infinite; }
  @keyframes blink { 0%,90%,100% { transform: scaleY(1);} 93%,96% { transform: scaleY(.08);} }

  .ribbon { animation: ribbonWave .8s ease-in-out infinite; }
  @keyframes ribbonWave { 0%,100% { transform: rotate(-5deg);} 50% { transform: rotate(6deg);} }
  #rib1 { transform-origin: 748px 522px; }
  #rib2 { transform-origin: 748px 526px; animation-delay: .18s; }
  #wkRib1 { transform-origin: 322px 446px; }
  #wkRib2 { transform-origin: 322px 450px; animation-delay: .2s; }
  #pennant { transform-origin: 470px 452px; animation: ribbonWave 1s ease-in-out infinite; }
  #emperorRib1 { transform-origin: 975px 288px; }
  #emperorRib2 { transform-origin: 975px 292px; animation-delay: .22s; }

  #fish { transform-origin: 714px 424px; animation: fishWig 1.5s ease-in-out infinite; }
  @keyframes fishWig { 0%,100% { transform: rotate(-5deg);} 50% { transform: rotate(5deg);} }

  .puff { transform-box: fill-box; transform-origin: center; animation: puffFly 1.9s linear infinite; }
  .puff.p2 { animation-delay: .63s; }
  .puff.p3 { animation-delay: 1.26s; }
  @keyframes puffFly {
    0%   { transform: translate(0,0) scale(.35); opacity: .9; }
    100% { transform: translate(150px,-16px) scale(1.9); opacity: 0; }
  }

  .streak { animation: streakMove 1.4s linear infinite; }
  .streak.s2 { animation-delay: .35s; }
  .streak.s3 { animation-delay: .7s;  }
  .streak.s4 { animation-delay: 1.05s; }
  .streak.s5 { animation-delay: .5s; animation-duration: 1.7s; }
  .streak.s6 { animation-delay: .9s; animation-duration: 1.2s; }
  @keyframes streakMove {
    0%   { transform: translateX(-40px); opacity: 0; }
    15%  { opacity: .6; }
    85%  { opacity: .45; }
    100% { transform: translateX(300px); opacity: 0; }
  }

  .beacon { animation: beaconBlink 1.3s linear infinite; }
  @keyframes beaconBlink { 0%,44%,100% { opacity:.2;} 50%,62% { opacity:1;} }
  .cockpit-lamp { animation: lampBlink 1.1s steps(1) infinite; }
  .cockpit-lamp.l2 { animation-delay: .37s; }
  .cockpit-lamp.l3 { animation-delay: .74s; }
  @keyframes lampBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: .25; } }

  svg.paused * { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) {
    #scene * { animation: none !important; }
  }
</style>
</head>
<body>
<header>
  <h1>高空打螺丝 <span class="tag">· 悟空航空特班「大秦工程」</span></h1>
  <p class="sub">孙悟空驾驶大型专机巡航万米高空。机翼上，鹈鹕蹬着自行车，展开的双翼稳稳托起秦始皇的北极熊；始皇帝骑在熊背上，正把一副青铜肩甲拧上熊肩——工程不能停，螺丝必须打。</p>
</header>

<div class="stage">
  <div class="hud">
    <button id="btnPause" type="button">⏸ 暂停动画</button>
  </div>
  <div class="frame">
<svg id="scene" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车在孙悟空驾驶的大飞机机翼上，展开翅膀托着北极熊，秦始皇骑在熊上打螺丝的 SVG 动画">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#2f7fc9"/>
      <stop offset=".45" stop-color="#7cc3ef"/>
      <stop offset=".78" stop-color="#c7e7f8"/>
      <stop offset="1"   stop-color="#ffe9c9"/>
    </linearGradient>
    <radialGradient id="sunG" cx=".5" cy=".5" r=".5">
      <stop offset="0"   stop-color="#fff6d8" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#ffe08a" stop-opacity=".45"/>
      <stop offset="1"   stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fuseG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fdfaf2"/>
      <stop offset=".55" stop-color="#f1ecdf"/>
      <stop offset="1"   stop-color="#d8d2c2"/>
    </linearGradient>
    <linearGradient id="wingG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#e8eef3"/>
      <stop offset=".5"  stop-color="#c9d5de"/>
      <stop offset="1"   stop-color="#a7b6c2"/>
    </linearGradient>
    <linearGradient id="engineG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#e3e9ee"/>
      <stop offset="1"   stop-color="#9fadb9"/>
    </linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe6ff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#5b93c2" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8b53d"/>
      <stop offset="1" stop-color="#ef8d1e"/>
    </linearGradient>
    <linearGradient id="featherG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecf2"/>
    </linearGradient>
    <linearGradient id="bearG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde5ec"/>
    </linearGradient>
    <linearGradient id="bronzeG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c39a5e"/>
      <stop offset=".5" stop-color="#9a7440"/>
      <stop offset="1" stop-color="#7a5a2e"/>
    </linearGradient>
    <linearGradient id="robeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a34"/>
      <stop offset="1" stop-color="#131319"/>
    </linearGradient>
    <clipPath id="fuseClip">
      <path d="M 80 575 C 80 520 130 492 200 488 L 1600 488 L 1600 662 L 260 662 C 150 660 80 632 80 575 Z"/>
    </clipPath>
    <clipPath id="canopyClip">
      <path d="M 168 490 C 176 434 240 408 320 410 C 370 412 404 430 424 490 Z"/>
    </clipPath>
    <g id="cl1">
      <ellipse cx="80" cy="46" rx="80" ry="22"/>
      <circle cx="42" cy="34" r="26"/>
      <circle cx="86" cy="24" r="32"/>
      <circle cx="128" cy="38" r="20"/>
    </g>
    <g id="cl2">
      <ellipse cx="60" cy="34" rx="60" ry="16"/>
      <circle cx="34" cy="24" r="18"/>
      <circle cx="68" cy="16" r="22"/>
      <circle cx="96" cy="26" r="14"/>
    </g>
    <g id="screwShape">
      <circle r="4.4" fill="#c9d2da" stroke="#7d8892" stroke-width="1.2"/>
      <path d="M -2.6 0 H 2.6 M 0 -2.6 V 2.6" stroke="#5f6a74" stroke-width="1.2"/>
    </g>
    <g id="glintStar">
      <path d="M 0 -9 L 2 -2 L 9 0 L 2 2 L 0 9 L -2 2 L -9 0 L -2 -2 Z" fill="#fffbe8"/>
    </g>
  </defs>

  <!-- ================= 天空 ================= -->
  <rect width="1600" height="1000" fill="url(#skyG)"/>

  <g>
    <circle class="sun-glow" cx="1430" cy="150" r="120" fill="url(#sunG)"/>
    <circle cx="1430" cy="150" r="48" fill="#ffe9a8"/>
    <circle cx="1430" cy="150" r="48" fill="none" stroke="#fff3c4" stroke-width="6" opacity=".7"/>
  </g>

  <!-- 远云 -->
  <g class="drift dr3" opacity=".5"><g transform="translate(120,170) scale(.8)"><use href="#cl2" fill="#ffffff"/></g></g>
  <g class="drift dr6" opacity=".45"><g transform="translate(820,120) scale(.7)"><use href="#cl1" fill="#ffffff"/></g></g>
  <g class="drift dr5" opacity=".6"><g transform="translate(430,300) scale(1)"><use href="#cl2" fill="#ffffff"/></g></g>

  <!-- 远处小鸟 -->
  <g class="drift dr6" opacity=".5">
    <g transform="translate(300,240)" stroke="#3d5a73" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M 0 0 q 6 -7 12 0 q 6 -7 12 0"/>
      <path d="M 34 22 q 5 -6 10 0 q 5 -6 10 0"/>
    </g>
  </g>

  <!-- 中景云 -->
  <g class="drift dr2" opacity=".8"><g transform="translate(80,380) scale(1.25)"><use href="#cl1" fill="#ffffff"/></g></g>
  <g class="drift dr4" opacity=".75"><g transform="translate(1050,230) scale(1)"><use href="#cl1" fill="#ffffff"/></g></g>

  <!-- 风线（远景） -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <path class="streak s5" d="M 380 330 h 120" stroke-width="3" opacity=".5"/>
    <path class="streak s6" d="M 1180 200 h 90"  stroke-width="3" opacity=".45"/>
  </g>

  <!-- ================= 飞机 ================= -->
  <g id="plane">

    <!-- 远侧机翼（透视） -->
    <path d="M 900 492 C 1100 470 1300 430 1462 396 C 1474 404 1472 416 1456 422 C 1280 462 1080 498 920 512 Z"
          fill="#a9bac8" opacity=".85"/>
    <path d="M 900 492 C 1100 470 1300 430 1462 396" fill="none" stroke="#8fa3b2" stroke-width="2" opacity=".7"/>

    <!-- 机身 -->
    <path d="M 80 575 C 80 520 130 492 200 488 L 1600 488 L 1600 662 L 260 662 C 150 660 80 632 80 575 Z"
          fill="url(#fuseG)" stroke="#b9b2a0" stroke-width="2"/>
    <g clip-path="url(#fuseClip)">
      <rect x="60" y="566" width="1560" height="40" fill="#c8342b"/>
      <rect x="60" y="558" width="1560" height="7" fill="#e0a92e"/>
      <rect x="60" y="606" width="1560" height="7" fill="#e0a92e"/>
      <!-- 机身祥雲纹 -->
      <g fill="none" stroke="#e0a92e" stroke-width="3.5" stroke-linecap="round" opacity=".9">
        <path d="M 1330 638 q 12 -14 26 -5 q 10 7 -3 13 q -15 6 -20 -6 q -4 -11 9 -16 q 16 -6 26 5"/>
        <path d="M 1420 630 q 10 -12 22 -4 q 8 6 -2 11 q -12 5 -16 -5"/>
        <path d="M 520 636 q 12 -14 26 -5 q 10 7 -3 13 q -15 6 -20 -6 q -4 -11 9 -16 q 16 -6 26 5"/>
      </g>
      <text x="1195" y="595" font-family="'Kaiti SC','STKaiti','Songti SC',serif" font-size="27" font-weight="bold"
            fill="#f7efdf" letter-spacing="10">悟空航空</text>
      <text x="640" y="592" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#f0c96a" letter-spacing="2">NO.221 BC</text>
    </g>

    <!-- 舷窗（含猴子分身乘客） -->
    <g>
      <g fill="#2e4a5e" stroke="#b8912e" stroke-width="2.5">
        <circle cx="560" cy="530" r="13"/><circle cx="655" cy="530" r="13"/><circle cx="750" cy="530" r="13"/>
        <circle cx="845" cy="530" r="13"/><circle cx="940" cy="530" r="13"/><circle cx="1035" cy="530" r="13"/>
        <circle cx="1130" cy="530" r="13"/><circle cx="1225" cy="530" r="13"/><circle cx="1320" cy="530" r="13"/>
        <circle cx="1415" cy="530" r="13"/><circle cx="1510" cy="530" r="13"/>
      </g>
      <g fill="#ffffff" opacity=".25">
        <path d="M 553 524 a 9 9 0 0 1 12 -3 l -3 6 Z"/><path d="M 1028 524 a 9 9 0 0 1 12 -3 l -3 6 Z"/>
        <path d="M 1408 524 a 9 9 0 0 1 12 -3 l -3 6 Z"/>
      </g>
      <!-- 猴子分身 1 -->
      <g>
        <circle cx="1130" cy="531" r="9" fill="#e3a63f"/>
        <circle cx="1121" cy="531" r="3" fill="#e3a63f"/><circle cx="1139" cy="531" r="3" fill="#e3a63f"/>
        <ellipse cx="1130" cy="533" rx="6.5" ry="5.5" fill="#f8dcae"/>
        <circle cx="1127" cy="530" r="1.2" fill="#23232b"/><circle cx="1133" cy="530" r="1.2" fill="#23232b"/>
        <path d="M 1126 536 q 4 3.4 8 0" stroke="#8a5a2a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      </g>
      <!-- 猴子分身 2 -->
      <g>
        <circle cx="750" cy="531" r="9" fill="#e3a63f"/>
        <circle cx="741" cy="531" r="3" fill="#e3a63f"/><circle cx="759" cy="531" r="3" fill="#e3a63f"/>
        <ellipse cx="750" cy="533" rx="6.5" ry="5.5" fill="#f8dcae"/>
        <circle cx="747" cy="530" r="1.2" fill="#23232b"/><circle cx="753" cy="530" r="1.2" fill="#23232b"/>
        <path d="M 746 536 q 4 3.4 8 0" stroke="#8a5a2a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- 机头金色鼻锥 + 天线小旗 -->
    <path d="M 80 575 C 80 548 88 526 100 510 L 120 516 C 106 534 98 553 97 575 C 98 598 106 620 120 636 L 100 642 C 88 624 80 602 80 575 Z"
          fill="#e0a92e" stroke="#b8912e" stroke-width="1.5"/>
    <g>
      <path d="M 470 488 L 486 450" stroke="#8b95a0" stroke-width="3.5" stroke-linecap="round"/>
      <path id="pennant" d="M 486 452 L 522 458 L 514 466 L 522 474 L 486 468 Z" fill="#c8342b"/>
    </g>

    <!-- 驾驶舱：孙悟空 -->
    <g clip-path="url(#canopyClip)">
      <rect x="150" y="400" width="300" height="110" fill="#7d97ad"/>
      <!-- 尾巴 -->
      <path d="M 336 546 q 30 6 24 -20 q -3 -16 -18 -10" fill="none" stroke="#e3a63f" stroke-width="6" stroke-linecap="round"/>
      <!-- 身体 -->
      <path d="M 262 548 C 264 505 276 486 295 484 C 314 486 327 505 330 548 Z" fill="#c8342b"/>
      <path d="M 268 528 h 56" stroke="#e0a92e" stroke-width="6"/>
      <ellipse cx="296" cy="504" rx="14" ry="12" fill="#f3d9a4"/>
